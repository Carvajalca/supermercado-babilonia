<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supermercado Babilonia</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <div class="header-container">

      <button class="icon-btn" id="menuBtn">
        ☰
      </button>

      <img
        src="assets/logo.png"
        alt="Supermercado Babilonia"
        class="logo">

      <button class="icon-btn cart-header" id="openCart">
        🛒
        <span id="cartCounter">0</span>
      </button>

    </div>

  </header>

  <!-- CONTENIDO -->
  <main class="container">

    <!-- CARRUSEL -->
    <section class="carousel">

      <div class="carousel-track" id="carouselTrack">

        <div class="slide">

          <img src="assets/banners/banner1.jpg" alt="Banner 1">

          <div class="slide-overlay">
            <h2>TODO LO QUE NECESITAS</h2>
            <p>AMA LA VIDA Y A NATALIA</p>
            <button>Haz tu pedido</button>
          </div>

        </div>

        <div class="slide">
          <img src="assets/banners/banner2.jpg" alt="Banner 2">
          <h2>TODO LO QUE NECESITAS</h2>
            <p>AMA LA VIDA Y A NATALIA</p>
            <button>Haz tu pedido</button>
        </div>

        <div class="slide">
          <img src="assets/banners/banner3.jpg" alt="Banner 3">
          <h2>TODO LO QUE NECESITAS</h2>
            <p>AMA LA VIDA Y A NATALIA</p>
            <button>Haz tu pedido</button>
        </div>

      </div>

      <div class="dots" id="carouselDots">
        <span class="active"></span>
        <span></span>
        <span></span>
      </div>

    </section>

    <!-- BUSCADOR -->
    <section class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Buscar productos...">

      <span class="search-icon">🔍</span>

    </section>

    <!-- CATEGORÍAS -->
    <section>

      <div class="section-title">
        <h3>Categorías</h3>
        <a href="#">Ver todas</a>
      </div>

      <div class="categories">

        <div class="category">
          <div>🌾</div>
          <span>Granos</span>
        </div>

        <div class="category">
          <div>🥛</div>
          <span>Lácteos</span>
        </div>

        <div class="category">
          <div>🥚</div>
          <span>Huevos</span>
        </div>

        <div class="category">
          <div>🫓</div>
          <span>Panadería</span>
        </div>

        <div class="category">
          <div>🥤</div>
          <span>Bebidas</span>
        </div>

      </div>

    </section>

    <!-- PRODUCTOS -->
    <section>

      <div class="section-title">
        <h3>Productos destacados</h3>
      </div>

      <div id="productList" class="product-list"></div>

    </section>

  </main>

  <!-- CARRITO FLOTANTE -->
  <button class="floating-cart" id="floatingCart">

    <div>
      🛒 Ver pedido
      <small id="itemsCart">0 productos</small>
    </div>

    <strong id="totalCart">$0</strong>

  </button>

  <!-- MODAL DEL CARRITO -->
  <div class="modal hidden" id="cartModal">

    <div class="modal-content">

      <div class="modal-header">

        <button class="back-btn">←</button>

        <h2>Tu pedido</h2>

        <button class="close-btn">✕</button>

      </div>

      <div id="cartItems"></div>

      <div class="cart-total">
        <span>Total</span>
        <strong id="cartTotalModal">$0</strong>
      </div>

      <button class="primary-btn">
        Continuar con el pedido
      </button>

    </div>

  </div>

  <script src="js/app.js"></script>

</body>
</html>
